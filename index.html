<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training Tracker</title>
<meta name="theme-color" content="#D9480F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#F1F3F6;--panel:#fff;--ink:#1B2430;--mute:#65707F;--line:#D9DEE5;--acc:#D9480F;--accink:#fff;--ok:#1E9E6A;--chip:#E8ECF2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171E;--panel:#1B222C;--ink:#EAEEF3;--mute:#93A0B1;--line:#2B3441;--acc:#FF8A3D;--accink:#1B1006;--ok:#3CC58C;--chip:#263040}}
:root[data-theme="dark"]{--bg:#12171E;--panel:#1B222C;--ink:#EAEEF3;--mute:#93A0B1;--line:#2B3441;--acc:#FF8A3D;--accink:#1B1006;--ok:#3CC58C;--chip:#263040}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 90px}
h1{font:700 2.2rem/1 "Barlow Condensed",Impact,sans-serif;margin:0;letter-spacing:.01em}
h2{font:700 1.5rem/1.1 "Barlow Condensed",Impact,sans-serif;margin:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}
.sum{color:var(--mute);font-size:.9rem;text-align:right}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:6px;width:120px;margin-left:auto;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}
.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 0;font:600 .95rem Barlow,sans-serif;cursor:pointer;position:relative}
.tab small{display:block;color:var(--mute);font-weight:500;font-size:.72rem}
.tab[aria-selected=true]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.tab[aria-selected=true] small{color:inherit;opacity:.85}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.row.done{opacity:.55}.row.done .nm{text-decoration:line-through}
.chk{width:28px;height:28px;accent-color:var(--ok);cursor:pointer}
.nm{font-weight:600;font-size:1.05rem}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--chip);border-radius:6px;padding:2px 8px;font-size:.85rem;color:var(--ink);border:0;font-family:inherit}
button.chip{cursor:pointer;color:var(--acc);font-weight:600}
.dayline{color:var(--mute);font-size:.8rem;margin-top:4px}
.ic{background:none;border:0;color:var(--mute);cursor:pointer;font-size:.85rem;padding:6px;font-family:inherit}
.ic:hover{color:var(--ink)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:28px 16px;text-align:center;color:var(--mute);margin-bottom:12px}
.btn{background:var(--acc);color:var(--accink);border:0;border-radius:8px;padding:12px 16px;font:600 1rem Barlow,sans-serif;cursor:pointer;width:100%}
.btn.sec{background:var(--chip);color:var(--ink)}
form,.fm{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:12px}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:4px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:1rem Barlow,sans-serif}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.days{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 16px}
.days label{margin:0;color:var(--ink);cursor:pointer}
.days input{position:absolute;opacity:0;width:0;height:0}
.days span{display:inline-block;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-weight:600}
.days input:checked+span{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.days input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.acts{display:flex;gap:8px}
.foot{display:flex;justify-content:space-between;margin-top:18px}
#timer{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);display:none;justify-content:space-between;align-items:center;font:700 1.6rem "Barlow Condensed",sans-serif}
#timer button{background:none;border:1px solid currentColor;color:inherit;border-radius:8px;padding:6px 12px;font:600 .95rem Barlow,sans-serif;cursor:pointer}
.vsw{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:16px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.nav .ic{font-size:1.6rem;padding:2px 14px}
.rbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.ch{text-align:center;font-size:.8rem;color:var(--mute);padding:4px 0}
.cell{min-height:58px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:4px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.cell span{font-size:.72rem;color:var(--mute)}
.cell.out{opacity:.4}.cell.tr{background:#D62839;border-color:#D62839;color:#fff}.cell.tr span{color:#fff}
.cell.today{background:#F2FF00;border-color:#F2FF00;color:#111}.cell.today span{color:#333}.cell.out.today{opacity:1}
.cell.today.tr{box-shadow:inset 0 0 0 3px #D62839}
.wkrow{display:flex;justify-content:space-between;width:100%;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
[hidden]{display:none!important}
.ap{display:flex;gap:8px;align-items:center;margin:6px 0;color:var(--ink);font-size:1rem}.ap input[type=radio]{width:auto;accent-color:var(--acc)}
.rst{border:2px solid var(--acc);background:none;color:var(--acc);border-radius:8px;padding:6px 16px;font:600 .95rem Barlow,sans-serif;cursor:pointer;margin-bottom:6px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.mp{background:var(--panel);border-radius:12px;padding:22px;max-width:360px;width:100%}.mp p{font:700 1.4rem/1.15 "Barlow Condensed",Impact,sans-serif;margin:0 0 16px}
.gh{margin:18px 0 6px}.gl{margin:0}.gl dt{font-weight:600;margin-top:10px}.gl dd{margin:2px 0 0;color:var(--mute);font-size:.92rem}
.vsw .tab{font-size:.8rem;padding:8px 2px}
.kgi{width:84px;padding:6px 8px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{font:700 2rem/1 "Barlow Condensed",Impact,sans-serif;display:block;color:var(--acc)}.kpi span{font-size:.8rem;color:var(--mute)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px;color:var(--ink)}.card h2{margin-bottom:2px}
.hb{display:grid;grid-template-columns:104px 1fr 78px;gap:8px;align-items:center;margin:7px 0;font-size:.85rem}.hb i{display:block;height:14px;border-radius:7px}.hb em{font-style:normal;text-align:right;color:var(--mute)}
.vb{display:flex;align-items:flex-end;gap:5px;height:150px;margin-top:10px}.vb div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:.65rem;color:var(--mute);gap:2px}.vb i{width:100%;border-radius:6px 6px 0 0;background:linear-gradient(0deg,var(--acc),#FFB347);min-height:2px}
.rt{width:100%;border-collapse:collapse;font-size:.9rem;margin:8px 0}.rt th,.rt td{border:1px solid var(--line);padding:6px;text-align:center}.rt th{background:var(--chip)}
.up{color:#2F9E44;font-weight:600}.dn{color:#D6336C;font-weight:600}
</style>
</head>
<body>
<div id="auth" hidden></div>
<main id="app" hidden>
  <div class="top">
    <div><h1>Training tracker</h1><div class="dayline"><span id="who"></span> <button class="ic" data-a="logout" style="padding:2px 6px">Cerrar sesión</button></div></div>

  <section id="gv" hidden></section>

function iso(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function pd(s){var p=s.split("-");return new Date(+p[0],p[1]-1,+p[2])}

function rCal(){
